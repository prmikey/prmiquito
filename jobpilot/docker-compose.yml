services:
  jobpilot:
    build: .
    ports:
      - "8300:8300"
    env_file:
      - .env
    environment:
      # From inside the container, "localhost" is the container itself.
      # host-gateway points at the VM, where Ollama listens on 11434.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/srv/jobpilot/data
    restart: unless-stopped
