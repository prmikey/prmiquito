<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#68737f; --accent:#2563eb; --line:#e3e7ec; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12161c; --card:#1a212b; --ink:#e8ecf1; --muted:#93a0ad; --accent:#5b8def; --line:#2a3441; }
}
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
nav { display:flex; gap:1.2rem; align-items:center; padding:.8rem 1.4rem; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
nav .brand { font-weight:700; margin-right:.5rem; }
nav a { color:var(--muted); text-decoration:none; }
nav a.active, nav a:hover { color:var(--accent); }
main { max-width:1200px; margin:1.5rem auto; padding:0 1.2rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem 1.2rem; margin-bottom:1rem; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:.85rem; }
.pill { display:inline-block; padding:.1rem .55rem; border-radius:99px; font-size:.78rem; background:var(--line); }
.pill.queued { background:#dbeafe; color:#1e40af; }
.pill.applied { background:#dcfce7; color:#166534; }
.pill.skipped, .pill.filtered, .pill.rejected { background:#fee2e2; color:#991b1b; }
.pill.matched, .pill.interviewing { background:#fef9c3; color:#854d0e; }
.pill.offer { background:#f3e8ff; color:#6b21a8; }
button, .btn { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:.42rem .9rem; font-size:.9rem; cursor:pointer; text-decoration:none; display:inline-block; }
button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
input[type=text], input[type=number], textarea, select { width:100%; padding:.45rem .6rem; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); font:inherit; }
textarea { min-height:110px; resize:vertical; }
label { display:block; font-size:.85rem; color:var(--muted); margin:.7rem 0 .2rem; }
.muted { color:var(--muted); font-size:.85rem; }
.error { color:#b91c1c; font-weight:600; }
.flag-llm { color:#b45309; font-size:.78rem; font-weight:600; }
.flag-blank { color:#b91c1c; font-size:.78rem; font-weight:600; }
.columns { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:.8rem; }
.col h3 { margin:.2rem 0 .6rem; font-size:.95rem; }
.kcard { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; margin-bottom:.55rem; font-size:.85rem; }
.row-actions form { display:inline; }
.statbar { display:flex; gap:.8rem; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<nav>
  <span class="brand">🛩️ JobPilot</span>
  <a href="/">Jobs</a>
  <a href="/review">Review queue</a>
  <a href="/board">Board</a>
  <a href="/profile">Profile</a>
  <a href="/settings">Settings</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
